
services:
  # ── Creo API Web Service ──────────────────────────────────────────────
  - type: web
    name: creo-api
    runtime: python
    region: singapore
    plan: standard
    numInstances: 2
    buildCommand: "cd backend && (poetry install --no-root --only main || pip install -r requirements.txt)"
    # IMPORTANT: alembic upgrade head runs in startCommand, NEVER in buildCommand.
    # Build commands execute before database environment bindings are provisioned
    # and multiple concurrent builds can cause DDL race conditions.
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
    # Liveness must not repeatedly poll PostgreSQL and Redis.
    # /api/v1/health remains available for dependency monitoring.
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: creo-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: 15
      - key: REFRESH_TOKEN_DAYS
        value: 30
      - key: ENCRYPTION_KEY
        # Must be Fernet.generate_key(), not Render's generic generated secret.
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_LOGIN_APP_ID
        sync: false
      - key: INSTAGRAM_LOGIN_APP_SECRET
        sync: false
      - key: META_LOGIN_CONFIG_ID
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        value: https://creo.yogalakshmibaskar20.workers.dev/portal/account/instagram
      - key: INSTAGRAM_CLIENT_MODE
        value: real
      - key: INSTAGRAM_PUBLISHING_ENABLED
        value: "true"
      - key: PUBLISHING_DISPATCH_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v26.0
      - key: INSTAGRAM_FFPROBE_PATH
        value: ffprobe
      - key: INSTAGRAM_MAX_LATENESS_MINUTES
        value: "30"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        # Set this to a sender verified in Brevo.
        sync: false
      - key: BREVO_FROM_NAME
        value: Creo
      - key: SMTP_SERVER
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"

  # ── Creo Background Task Worker ───────────────────────────────────────
  - type: worker
    name: creo-worker
    runtime: python
    region: singapore
    plan: standard
    buildCommand: "cd backend && (poetry install --no-root --only main || pip install -r requirements.txt)"
    startCommand: "cd backend && celery -A app.workers.celery_app worker -Q publish,default -c 4 --loglevel=info"
    envVars:
      - key: JWT_SECRET
        fromService:
          name: creo-api
          type: web
          envVarKey: JWT_SECRET
      - key: PYTHON_VERSION
        value: 3.12.0
      # Celery tasks run asyncio.run() per task, so pooled asyncpg connections
      # cannot be reused across tasks; the web service keeps its pool.
      - key: DB_USE_NULLPOOL
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: SMTP_SERVER
        fromService:
          name: creo-api
          type: web
          envVarKey: SMTP_SERVER
      - key: SMTP_PORT
        fromService:
          name: creo-api
          type: web
          envVarKey: SMTP_PORT
      - key: SMTP_USERNAME
        fromService:
          name: creo-api
          type: web
          envVarKey: SMTP_USERNAME
      - key: SMTP_PASSWORD
        fromService:
          name: creo-api
          type: web
          envVarKey: SMTP_PASSWORD
      - key: SMTP_FROM_EMAIL
        fromService:
          name: creo-api
          type: web
          envVarKey: SMTP_FROM_EMAIL
      - key: SMTP_USE_TLS
        fromService:
          name: creo-api
          type: web
          envVarKey: SMTP_USE_TLS
      - key: SMTP_USE_SSL
        fromService:
          name: creo-api
          type: web
          envVarKey: SMTP_USE_SSL
      - key: BREVO_API_KEY
        fromService:
          name: creo-api
          type: web
          envVarKey: BREVO_API_KEY
      - key: BREVO_FROM_EMAIL
        fromService:
          name: creo-api
          type: web
          envVarKey: BREVO_FROM_EMAIL
      - key: BREVO_FROM_NAME
        fromService:
          name: creo-api
          type: web
          envVarKey: BREVO_FROM_NAME
      - key: ENCRYPTION_KEY
        fromService:
          name: creo-api
          type: web
          envVarKey: ENCRYPTION_KEY
      - key: INSTAGRAM_APP_ID
        fromService:
          name: creo-api
          type: web
          envVarKey: INSTAGRAM_APP_ID
      - key: INSTAGRAM_APP_SECRET
        fromService:
          name: creo-api
          type: web
          envVarKey: INSTAGRAM_APP_SECRET
      - key: INSTAGRAM_REDIRECT_URI
        fromService:
          name: creo-api
          type: web
          envVarKey: INSTAGRAM_REDIRECT_URI
      - key: INSTAGRAM_LOGIN_APP_ID
        fromService:
          type: web
          name: creo-api
          envVarKey: INSTAGRAM_LOGIN_APP_ID
      - key: INSTAGRAM_LOGIN_APP_SECRET
        fromService:
          type: web
          name: creo-api
          envVarKey: INSTAGRAM_LOGIN_APP_SECRET
      - key: INSTAGRAM_CLIENT_MODE
        fromService:
          name: creo-api
          type: web
          envVarKey: INSTAGRAM_CLIENT_MODE
      - key: INSTAGRAM_PUBLISHING_ENABLED
        fromService:
          name: creo-api
          type: web
          envVarKey: INSTAGRAM_PUBLISHING_ENABLED
      - key: META_GRAPH_API_VERSION
        fromService:
          name: creo-api
          type: web
          envVarKey: META_GRAPH_API_VERSION
      - key: INSTAGRAM_FFPROBE_PATH
        fromService:
          name: creo-api
          type: web
          envVarKey: INSTAGRAM_FFPROBE_PATH
      - key: INSTAGRAM_MAX_LATENESS_MINUTES
        fromService:
          name: creo-api
          type: web
          envVarKey: INSTAGRAM_MAX_LATENESS_MINUTES
      - key: DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: creo-redis
          property: connectionString

  # ── Creo Beat Periodic Scheduler ─────────────────────────────────────
  - type: worker
    name: creo-beat
    runtime: python
    region: singapore
    plan: starter
    buildCommand: "cd backend && (poetry install --no-root --only main || pip install -r requirements.txt)"
    # CRITICAL INVARIANT: NEVER scale creo-beat above 1 instance.
    # While database rows use FOR UPDATE SKIP LOCKED for due publish pickup,
    # running multiple Celery beat instances causes duplicate scheduling of
    # notification sweeps, KPI refreshes, and maintenance crons.
    startCommand: "cd backend && celery -A app.workers.celery_app beat --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: DB_USE_NULLPOOL
        value: "true"
      - key: JWT_SECRET
        fromService:
          name: creo-api
          type: web
          envVarKey: JWT_SECRET
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: creo-redis
          property: connectionString

  # ── Redis Broker & Cache ──────────────────────────────────────────────
  # NOTE: maxmemoryPolicy MUST be set to noeviction.
  # If configured with allkeys-lru or volatile-lru, Redis will silently evict
  # Celery task queues under memory pressure, causing unrecoverable job loss.
  - type: redis
    name: creo-redis
    region: singapore
    plan: standard
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal private network only


services:
  # ── Creo API Web Service ──────────────────────────────────────────────
  - type: web
    name: creo-api
    runtime: python
    region: singapore
    plan: standard
    numInstances: 2
    buildCommand: "poetry install --no-root --only main || pip install -r requirements.txt"
    # IMPORTANT: alembic upgrade head runs in startCommand, NEVER in buildCommand.
    # Build commands execute before database environment bindings are provisioned
    # and multiple concurrent builds can cause DDL race conditions.
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: creo-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: 15
      - key: REFRESH_TOKEN_DAYS
        value: 30

  # ── Creo Background Task Worker ───────────────────────────────────────
  - type: worker
    name: creo-worker
    runtime: python
    region: singapore
    plan: standard
    buildCommand: "poetry install --no-root --only main || pip install -r requirements.txt"
    startCommand: "cd backend && celery -A app.workers.celery_app worker -Q publish,default -c 4 --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: creo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: creo-redis
          property: connectionString

  # ── Creo Beat Periodic Scheduler ─────────────────────────────────────
  - type: worker
    name: creo-beat
    runtime: python
    region: singapore
    plan: starter
    buildCommand: "poetry install --no-root --only main || pip install -r requirements.txt"
    # CRITICAL INVARIANT: NEVER scale creo-beat above 1 instance.
    # While database rows use FOR UPDATE SKIP LOCKED for due publish pickup,
    # running multiple Celery beat instances causes duplicate scheduling of
    # notification sweeps, KPI refreshes, and maintenance crons.
    startCommand: "cd backend && celery -A app.workers.celery_app beat --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: creo-redis
          property: connectionString

  # ── Redis Broker & Cache ──────────────────────────────────────────────
  # NOTE: maxmemoryPolicy MUST be set to noeviction.
  # If configured with allkeys-lru or volatile-lru, Redis will silently evict
  # Celery task queues under memory pressure, causing unrecoverable job loss.
  - type: redis
    name: creo-redis
    region: singapore
    plan: standard
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal private network only

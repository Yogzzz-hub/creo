<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050810" />
    <!-- Apply the saved theme before first paint (see src/lib/theme.tsx) -->
    <script>
      try {
        if (localStorage.getItem("creo-theme") === "light") {
          var r = document.documentElement;
          r.dataset.theme = "light";
          r.classList.remove("dark");
          r.style.colorScheme = "light";
          document.querySelector('meta[name="color-scheme"]').content = "light";
          document.querySelector('meta[name="theme-color"]').content = "#eceadf";
        } else {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
    <title>Creo Platform — Content Production SaaS</title>
    <!-- The font used throughout Creo comes from the same edge as the app. -->
    <link rel="preload" href="/assets/fonts/inter-latin-v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!-- Clean Premium Fonts: Inter, Figtree, DM Sans, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Figtree:ital,wght@0,300..900;1,300..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Media storage preconnect -->
    <link rel="preconnect" href="https://storage.creo.network" />
    <link rel="dns-prefetch" href="https://storage.creo.network" />

    <!-- Warm the production API while the dashboard bundle loads. Checkout loads on demand. -->
    <link rel="preconnect" href="https://creo-api-singapore.onrender.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

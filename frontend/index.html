<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Creo Platform — Content Production SaaS</title>
    <!-- Google Fonts for Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Media storage preconnect -->
    <link rel="preconnect" href="https://storage.creo.network" />
    <link rel="dns-prefetch" href="https://storage.creo.network" />

    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Razorpay Checkout Modal Dark Theme & Floating Fix -->
    <style>
      .razorpay-container {
        color-scheme: light !important;
        background: rgba(5, 8, 16, 0.82) !important;
        backdrop-filter: blur(8px) !important;
        -webkit-backdrop-filter: blur(8px) !important;
      }
      .razorpay-container iframe,
      iframe.razorpay-checkout-frame,
      iframe[src*="razorpay"],
      iframe[name*="razorpay"],
      iframe[id*="razorpay"] {
        color-scheme: light !important;
        background: transparent !important;
        background-color: transparent !important;
      }
      .razorpay-backdrop {
        background: rgba(5, 8, 16, 0.82) !important;
        backdrop-filter: blur(8px) !important;
        -webkit-backdrop-filter: blur(8px) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

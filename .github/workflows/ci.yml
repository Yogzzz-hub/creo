name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Checks & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: creo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Linter
        working-directory: ./backend
        run: ruff check . --exit-zero

      - name: Run Mypy Type Checker
        working-directory: ./backend
        run: mypy app/core

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/creo
          DIRECT_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/creo
        run: alembic upgrade head

      - name: Run Pytest
        working-directory: ./backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/creo
          DIRECT_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/creo
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-super-secret-key-for-ci-runs-32-chars-long
        run: pytest -v

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Biome Check
        working-directory: ./frontend
        continue-on-error: true
        run: npx @biomejs/biome check .

      - name: TypeScript Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

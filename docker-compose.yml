services:
  postgres:
    image: postgres:15-alpine
    container_name: creo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: creo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - creo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d creo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - creo-network

  redis:
    image: redis:7-alpine
    container_name: creo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - creo-network

volumes:
  creo_pgdata:
    name: creo_pgdata

networks:
  creo-network:
    name: creo-network

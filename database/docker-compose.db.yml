services:
  postgres:
    image: postgres:16-alpine
    container_name: creo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: creo_user
      POSTGRES_PASSWORD: creo_password
      POSTGRES_DB: creo_db
    ports:
      - "5432:5432"
    volumes:
      - creo_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creo_user -d creo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: creo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@creo.agency
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  creo_pgdata:
    driver: local
